<style>
:root {
  color-scheme: light;
  --paper: #ffffff; --ink: #16181d; --ink-2: #4a4f5c; --ink-3: #7a7f8c;
  --rule: #d6d8de; --grid: #eceef2; --band: rgba(22,24,29,.09);
  --red: #c8102e; --red-band: rgba(200,16,46,.13); --empty: #e4e6eb;
  --chip: #f4f5f7;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #131418; --ink: #eceef2; --ink-2: #b4b8c3; --ink-3: #8a8f9b;
    --rule: #34363e; --grid: #23252b; --band: rgba(236,238,242,.10);
    --red: #ff5c70; --red-band: rgba(255,92,112,.18); --empty: #2c2e35;
    --chip: #1d1f24;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #131418; --ink: #eceef2; --ink-2: #b4b8c3; --ink-3: #8a8f9b;
  --rule: #34363e; --grid: #23252b; --band: rgba(236,238,242,.10);
  --red: #ff5c70; --red-band: rgba(255,92,112,.18); --empty: #2c2e35;
  --chip: #1d1f24;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink);
  font-family: "STIX Two Text", "STIX Two", "Times New Roman", Georgia, serif;
  font-size: 18px; line-height: 1.6; font-variant-numeric: lining-nums; }
.page { max-width: 760px; margin: 0 auto; padding: 0 16px 72px; }
.wide { max-width: 980px; margin-left: auto; margin-right: auto; }

/* running header, as on a paper's first page */
.runhead { max-width: 980px; margin: 0 auto; padding: 14px 16px 8px; display: flex; justify-content: space-between;
  align-items: center; gap: 12px; border-bottom: 1px solid var(--rule); font-size: 14px; color: var(--ink-2); }
.runhead i { font-style: italic; }
.actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.btn { font: inherit; font-size: 14px; color: var(--ink); background: var(--chip); border: 1px solid var(--rule);
  border-radius: 999px; padding: 3px 12px; cursor: pointer; text-decoration: none; white-space: nowrap; line-height: 1.5; }
.btn:hover { border-color: var(--ink-3); }
.btn:focus-visible, a:focus-visible, summary:focus-visible, svg [tabindex]:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

/* title block */
.titleblock { text-align: center; padding: 56px 0 8px; }
h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.1; font-weight: 600; margin: 0 auto; max-width: 23ch;
  letter-spacing: -0.012em; text-wrap: balance; }
.byline { margin: 22px 0 0; font-size: 16px; color: var(--ink-2); }
.byline i { font-style: italic; }
.byline .self { color: var(--red); font-weight: 700; }

.abstract { max-width: 600px; margin: 40px auto 0; font-size: 17px; line-height: 1.6; }
.abstract h2 { text-align: center; font-size: 17px; font-weight: 700; margin: 0 0 8px; }
.abstract p { margin: 0; }

h2.sec { font-size: 22px; font-weight: 700; margin: 64px 0 10px; letter-spacing: -0.005em; }
p { margin: 0 0 14px; }
@media (min-width: 640px) { .page p.just, .abstract p { text-align: justify; hyphens: auto; } }

figure { margin: 44px auto 0; }
figcaption { font-size: 16px; line-height: 1.5; color: var(--ink); margin-top: 12px; max-width: 760px; margin-left: auto; margin-right: auto; }
figcaption b { font-weight: 700; }
figcaption .m { color: var(--ink-2); }

svg { display: block; overflow: visible; }
svg text { fill: var(--ink-2); font-family: inherit; font-size: 13px; font-variant-numeric: tabular-nums lining-nums; }
svg text.t-ink { fill: var(--ink); }
svg text.t-red { fill: var(--red); font-weight: 700; }
svg text.ann { fill: var(--ink); font-style: italic; font-size: 16px; }
svg text.ann.red { fill: var(--red); }
svg text.big { font-size: 40px; font-weight: 600; fill: var(--ink); }
svg text.big.red { fill: var(--red); }
.axis { stroke: var(--ink-3); stroke-width: 1; }
.gridline { stroke: var(--grid); stroke-width: 1; }
.ref { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 4; }
.line-ink { fill: none; stroke: var(--ink); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.line-red { fill: none; stroke: var(--red); stroke-width: 3; stroke-linejoin: round; stroke-linecap: round; }
.band-ink { fill: var(--band); }
.band-red { fill: var(--red-band); }
.dot-red { fill: var(--red); stroke: var(--paper); stroke-width: 2; }
.dot-ink { fill: var(--ink); stroke: var(--paper); stroke-width: 2; }
.guide { stroke: var(--ink-3); stroke-width: 1; }
.hit { fill: transparent; cursor: crosshair; }
.cell { fill: var(--empty); }
.cell.on { fill: var(--red); }
.whisk { stroke: var(--ink); stroke-width: 1.5; stroke-linecap: round; }
.zero { stroke: var(--ink-3); stroke-width: 1; }
@media (prefers-reduced-motion: no-preference) {
  .draw { animation: draw 1.4s cubic-bezier(.55,.05,.35,1) .35s both; }
  @keyframes draw { from { stroke-dashoffset: var(--len); } to { stroke-dashoffset: 0; } }
  .pop { animation: pop .3s ease-out 1.7s both; }
  @keyframes pop { from { opacity: 0; } to { opacity: 1; } }
}

/* table 1, booktabs */
.tbl { overflow-x: auto; margin: 0 auto; -webkit-overflow-scrolling: touch; }
table.bk { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums lining-nums; }
table.bk caption { caption-side: top; text-align: left; font-size: 16px; line-height: 1.5; padding-bottom: 10px; }
table.bk thead tr:first-child th { border-top: 2px solid var(--ink); }
table.bk thead th { border-bottom: 1px solid var(--ink); font-weight: 600; font-size: 15px; padding: 8px 10px; vertical-align: bottom; }
table.bk td { padding: 9px 10px; font-size: 19px; }
table.bk tbody tr:last-child td { border-bottom: 2px solid var(--ink); }
table.bk th:first-child, table.bk td:first-child { text-align: left; padding-left: 0; }
table.bk th, table.bk td { text-align: right; }
table.bk td.x { color: var(--red); font-weight: 700; white-space: nowrap; }
table.bk td:first-child { font-size: 17px; }
table.bk tr.mlab { display: none; }
table.bk .short { display: none; }
@media (max-width: 600px) {
  table.bk th:first-child, table.bk td.lab { display: none; }
  table.bk tr.mlab { display: table-row; }
  table.bk tr.mlab td { text-align: left; font-size: 15px; color: var(--ink-2); padding: 12px 0 0; }
  table.bk tr.vals td { padding-top: 2px; font-size: 20px; }
  table.bk tr.vals td:nth-child(2) { text-align: left; padding-left: 0; }
  table.bk th:nth-child(2) { text-align: left; padding-left: 0; }
  table.bk .long { display: none; }
  table.bk .short { display: inline; }
}

.waffles { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; max-width: 640px; margin: 0 auto; }
.waffle h3 { font-size: 16px; font-weight: 400; margin: 0 0 6px; line-height: 1.35; min-height: 2.7em; }
.waffle .pct { font-size: 46px; line-height: 1; font-weight: 600; margin: 0 0 12px; font-variant-numeric: tabular-nums lining-nums; }
.waffle .pct.red { color: var(--red); }
.key { display: flex; gap: 18px; justify-content: center; font-size: 15px; color: var(--ink-2); margin-top: 14px; flex-wrap: wrap; }
.key i { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }

.areas { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr); column-gap: 16px; }
.areas .nm { font-size: 15px; color: var(--ink); padding: 4px 0; line-height: 1.3; align-self: center; }
.areas .nm small { color: var(--ink-3); font-size: 13px; font-variant-numeric: tabular-nums; }
.areas .st { align-self: center; }
.areas .ax { grid-column: 2; }
@media (max-width: 600px) {
  body { font-size: 17px; }
  .waffles { gap: 16px; }
  .waffle .pct { font-size: 36px; }
  .areas { grid-template-columns: minmax(0, 1fr); }
  .areas .nm { padding: 8px 0 0; }
  .areas .ax { grid-column: 1; }
}

ul.lim { padding-left: 1.2em; margin: 0; }
ul.lim li { margin-bottom: 10px; }
.share-end { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }

details.appx { margin-top: 64px; border-top: 1px solid var(--rule); padding-top: 18px; }
details.appx > summary { cursor: pointer; font-size: 22px; font-weight: 700; list-style-position: outside; }
details.appx h3 { font-size: 18px; margin: 32px 0 6px; }
.small { font-size: 15px; color: var(--ink-2); }
table.plain { border-collapse: collapse; width: 100%; font-size: 15px; font-variant-numeric: tabular-nums lining-nums; }
table.plain th, table.plain td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
table.plain th { font-weight: 600; border-bottom: 1px solid var(--ink); white-space: nowrap; }
table.plain th:first-child, table.plain td:first-child { text-align: left; padding-left: 0; }
table.plain .note { color: var(--ink-3); font-size: 13px; }
a { color: var(--ink); text-decoration-color: var(--red); text-underline-offset: 3px; }
footer { margin-top: 56px; padding-top: 14px; border-top: 1px solid var(--rule); color: var(--ink-3); font-size: 14px; }

#tip { position: fixed; pointer-events: none; display: none; z-index: 5; background: var(--paper); color: var(--ink);
  border: 1px solid var(--rule); border-radius: 6px; padding: 8px 11px; font-size: 14px; line-height: 1.45;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); max-width: 300px; font-variant-numeric: tabular-nums lining-nums; }
#tip .t { color: var(--ink-2); margin-bottom: 3px; }
#tip .v { font-weight: 700; }
#tip .k { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 4px; }
#tip .m { color: var(--ink-2); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
</style>

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

function el(tag, attrs = {}, parent) {
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(n);
  return n;
}
function h(tag, props = {}, ...kids) {
  const n = document.createElement(tag);
  for (const k in props) { if (k === "class") n.className = props[k]; else if (k === "style") n.style.cssText = props[k]; else n.setAttribute(k, props[k]); }
  for (const c of kids) if (c != null) n.append(c);
  return n;
}
const tipEl = $("tip");
function showTip(e, title, rows) {
  tipEl.replaceChildren(h("div", { class: "t" }, title));
  for (const [v, lab, key] of rows) {
    const line = h("div");
    if (key) line.append(h("span", { class: "k", style: `background:${key}` }));
    line.append(h("span", { class: "v" }, v), " ", h("span", { class: "m" }, lab));
    tipEl.append(line);
  }
  tipEl.style.display = "block";
  const x = Math.max(8, Math.min(e.clientX + 14, innerWidth - tipEl.offsetWidth - 8));
  const y = e.clientY - tipEl.offsetHeight - 14;
  tipEl.style.left = x + "px"; tipEl.style.top = (y < 8 ? e.clientY + 18 : y) + "px";
}
const hideTip = () => { tipEl.style.display = "none"; };

// ---------- numbers used in the copy
const H = D.hero, lo60 = H.bottom60, t5 = H.top5, t1 = H.top1, M = D.main, V = D.ventiles;
const ratioOnes = t5.ones / lo60.ones;
const t1TopCount = Math.round(t1.top10 * t1.papers);
const x = r => (r >= 10 ? r.toFixed(0) : r.toFixed(1)) + "×";

const TITLE = `ICLR 2027 reviewers gave the most AI-sounding papers ${x(ratioOnes)} as many 1s`;
{ const [a, b] = TITLE.split("AI-sounding"); $("title").replaceChildren(a, h("span", { style: "white-space:nowrap" }, "AI-sounding"), b); }
$("abstract").textContent =
  `We matched ${fmt(D.n_joined)} ICLR 2027 submissions to their scores from an AI-text detector and to their reviews on OpenReview. ` +
  `For the 60% of papers that read least like an LLM, the detector score has no relationship with how reviewers rate them. ` +
  `Past that point, ratings fall off a cliff. The 5% of papers that read most like an LLM got ${x(ratioOnes)} as many 1s (the lowest score), ` +
  `${pct(t5.any_one)} of them got at least one 1, and only ${pct(t5.top10, 1)} cleared the top-10% cutoff. ` +
  `Of the ${fmt(t1.papers)} most AI-sounding papers of all, ${t1TopCount === 1 ? "one" : fmt(t1TopCount)} did.`;

// ---------- figure 1: the cliff
const BEND = 12; // ventiles 1..12 = bottom 60%
function fig1(animate) {
  const host = $("c1"), W = Math.max(300, host.clientWidth), small = W < 600;
  const Hh = small ? 330 : 440, m = { t: 34, r: small ? 14 : 90, b: 64, l: small ? 40 : 54 };
  const iw = W - m.l - m.r, ih = Hh - m.t - m.b, ylo = 1.65, yhi = 2.25;
  const X = p => m.l + iw * p / 100, Y = v => m.t + ih * (1 - (v - ylo) / (yhi - ylo));
  const svg = el("svg", { width: W, height: Hh, viewBox: `0 0 ${W} ${Hh}`, role: "img",
    "aria-label": `Line chart. Mean review rating stays near 2.13 for the 60% least AI-sounding papers, then falls steeply to ${f2(V[19].mean)} for the most AI-sounding 5%.` });
  for (let v = 1.7; v <= yhi + 1e-9; v += 0.1) {
    el("line", { x1: m.l, x2: m.l + iw, y1: Y(v), y2: Y(v), class: "gridline" }, svg);
    el("text", { x: m.l - 8, y: Y(v) + 4, "text-anchor": "end" }, svg).textContent = v.toFixed(1);
  }
  el("line", { x1: m.l, x2: m.l, y1: m.t, y2: m.t + ih, class: "axis" }, svg);
  el("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, class: "axis" }, svg);
  const ticks = small ? [0, 60, 100] : [0, 20, 40, 60, 80, 100];
  for (const p of ticks) {
    el("line", { x1: X(p), x2: X(p), y1: m.t + ih, y2: m.t + ih + 5, class: "axis" }, svg);
    el("text", { x: X(p), y: m.t + ih + 20, "text-anchor": p === 0 ? "start" : p === 100 ? "end" : "middle" }, svg).textContent = `${p}%`;
  }
  el("text", { x: m.l, y: Hh - 8, "text-anchor": "start" }, svg).textContent = small ? "← less AI-sounding" : "← reads least like an LLM";
  el("text", { x: m.l + iw, y: Hh - 8, "text-anchor": "end" }, svg).textContent = small ? "more AI-sounding →" : "reads most like an LLM →";
  el("text", { x: m.l + iw / 2, y: Hh - 30, "text-anchor": "middle", class: "t-ink" }, svg).textContent = small ? "Papers ranked by detector AI score" : "Papers ranked by the detector's AI score (percentile)";
  if (small) el("text", { x: 0, y: 12, "text-anchor": "start", class: "t-ink" }, svg).textContent = "Average review rating";
  else el("text", { x: 0, y: 0, transform: `translate(14,${m.t + ih / 2}) rotate(-90)`, "text-anchor": "middle", class: "t-ink" }, svg).textContent = "Average review rating";

  // everyone reference
  const all = D.rating_summary.mean;
  el("line", { x1: m.l, x2: m.l + iw, y1: Y(all), y2: Y(all), class: "ref" }, svg);
  el("text", { x: small ? m.l + iw : m.l + iw + 8, y: small ? Y(all) - 6 : Y(all) + 4, "text-anchor": small ? "end" : "start" }, svg).textContent = `all papers ${f2(all)}`;

  const px = V.map(v => X((v.k - 0.5) * 5)), py = V.map(v => Y(v.mean));
  const bandPath = (a, b) => {
    let d = ""; for (let i = a; i <= b; i++) d += `${i === a ? "M" : "L"}${px[i]},${Y(V[i].ci[1])}`;
    for (let i = b; i >= a; i--) d += `L${px[i]},${Y(V[i].ci[0])}`; return d + "Z";
  };
  el("path", { d: bandPath(0, BEND - 1), class: "band-ink" }, svg);
  el("path", { d: bandPath(BEND - 1, 19), class: "band-red" }, svg);
  const path = (a, b) => { let d = ""; for (let i = a; i <= b; i++) d += `${i === a ? "M" : "L"}${px[i]},${py[i]}`; return d; };
  el("path", { d: path(0, BEND - 1), class: "line-ink" }, svg);
  const red = el("path", { d: path(BEND - 1, 19), class: "line-red" }, svg);

  // annotations
  el("text", { x: X(30), y: Math.min(...py.slice(0, BEND)) - 16, "text-anchor": "middle", class: "ann" }, svg).textContent = small ? "flat for 60% of papers" : "Flat for 60% of papers";
  const endx = px[19], endy = py[19];
  const g = el("g", { class: animate ? "pop" : "" }, svg);
  el("circle", { cx: endx, cy: endy, r: 5.5, class: "dot-red" }, g);
  el("text", { x: small ? endx - 10 : endx + 12, y: endy + 6, "text-anchor": small ? "end" : "start", class: "big red", style: small ? "font-size:28px" : "" }, g).textContent = f2(V[19].mean);
  el("text", { x: X(76), y: Y(1.98) + (small ? 26 : 30), "text-anchor": "end", class: "ann red" }, g).textContent = "then the cliff";
  el("circle", { cx: px[0], cy: py[0], r: 4, class: "dot-ink" }, svg);
  el("text", { x: px[0] + 2, y: py[0] + 22, "text-anchor": "start", class: "t-ink", style: "font-weight:600;font-size:15px" }, svg).textContent = f2(V[0].mean);

  // hover
  const guide = el("line", { y1: m.t, y2: m.t + ih, class: "guide", visibility: "hidden" }, svg);
  const mark = el("circle", { r: 5, class: "dot-ink", visibility: "hidden" }, svg);
  const hit = el("rect", { x: m.l, y: m.t, width: iw, height: ih, class: "hit", tabindex: 0, "aria-label": "Chart data, use arrow keys" }, svg);
  let cur = -1;
  const show = (i, e) => {
    cur = i; const v = V[i], isRed = i >= BEND;
    guide.setAttribute("x1", px[i]); guide.setAttribute("x2", px[i]); guide.setAttribute("visibility", "visible");
    mark.setAttribute("cx", px[i]); mark.setAttribute("cy", py[i]); mark.setAttribute("visibility", "visible");
    mark.setAttribute("class", isRed ? "dot-red" : "dot-ink");
    showTip(e, `Papers ranked ${(v.k - 1) * 5}–${v.k * 5}% by AI score (${f3(v.lo)}–${f3(v.hi)})`, [
      [f2(v.mean), `average rating (95% CI ${f2(v.ci[0])}–${f2(v.ci[1])})`, css(isRed ? "--red" : "--ink")],
      [pct(v.low), `average ${f2(D.low_cutoff)} or lower`],
      [pct(v.top10, 1), "cleared the top-10% cutoff"],
      [fmt(v.n), "papers"]]);
  };
  hit.addEventListener("pointermove", e => {
    const b = svg.getBoundingClientRect(), xx = e.clientX - b.left;
    let best = 0; px.forEach((p, i) => { if (Math.abs(p - xx) < Math.abs(px[best] - xx)) best = i; });
    show(best, e);
  });
  const off = () => { hideTip(); guide.setAttribute("visibility", "hidden"); mark.setAttribute("visibility", "hidden"); };
  hit.addEventListener("pointerleave", off); hit.addEventListener("blur", off);
  hit.addEventListener("keydown", e => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    e.preventDefault(); const i = Math.max(0, Math.min(19, cur + (e.key === "ArrowRight" ? 1 : -1)));
    const r = svg.getBoundingClientRect(); show(i, { clientX: r.left + px[i], clientY: r.top + py[i] });
  });
  host.replaceChildren(svg);
  if (animate) { const L = red.getTotalLength(); red.style.setProperty("--len", L); red.style.strokeDasharray = L; red.classList.add("draw"); }
}
{
  const c = $("cap1");
  c.append(h("b", {}, "Figure 1: "), "Average review rating by how AI-sounding a paper is. ",
    h("span", { class: "m" }, `Papers are ranked by the detector's average AI score and cut into 20 equal groups of about ${fmt(V[0].n)}. Shaded bands are 95% confidence intervals. Ratings use ICLR 2027's 1–4 scale.`));
}

// ---------- table 1
{
  const rows = [
    ["Average rating", f2(lo60.mean), f2(t5.mean), ""],
    ["Reviews that gave a 1", pct(lo60.ones), pct(t5.ones), x(t5.ones / lo60.ones)],
    ["Papers with at least one 1", pct(lo60.any_one), pct(t5.any_one), x(t5.any_one / lo60.any_one)],
    ["Papers where every reviewer gave a 1", pct(lo60.all_one, 1), pct(t5.all_one, 1), x(t5.all_one / lo60.all_one)],
    ["Papers above the top-10% cutoff", pct(lo60.top10, 1), pct(t5.top10, 1), `${(lo60.top10 / t5.top10).toFixed(0)}× fewer`],
  ];
  const t = h("table", { class: "bk" });
  const c = h("caption"); c.append(h("b", {}, "Table 1: "), "The least AI-sounding 60% of papers against the most AI-sounding 5%.");
  t.append(c);
  const hr = h("tr");
  hr.append(h("th", {}, ""),
    h("th", {}, h("span", { class: "long" }, `Least AI-sounding 60% (${fmt(lo60.papers)})`), h("span", { class: "short" }, "Least AI-sounding 60%")),
    h("th", {}, h("span", { class: "long" }, `Most AI-sounding 5% (${fmt(t5.papers)})`), h("span", { class: "short" }, "Most AI-sounding 5%")),
    h("th", {}, "Change"));
  t.append(h("thead", {}, hr));
  const b = h("tbody");
  rows.forEach(r => {
    b.append(h("tr", { class: "mlab" }, h("td", { colspan: "3" }, r[0])));
    const tr = h("tr", { class: "vals" });
    r.forEach((s, i) => tr.append(h("td", i === 0 ? { class: "lab" } : i === 3 ? { class: "x" } : {}, s)));
    b.append(tr);
  });
  t.append(b);
  $("t1").append(t);
}

// ---------- figure 2: waffles
function fig2() {
  const host = $("c2");
  const groups = [[`Least AI-sounding 60% of papers`, lo60, false], [`Most AI-sounding 5% of papers`, t5, true]];
  host.replaceChildren(...groups.map(([label, g, red]) => {
    const box = h("div", { class: "waffle" });
    box.append(h("h3", {}, label), h("p", { class: "pct" + (red ? " red" : "") }, pct(g.any_one)));
    const probe = h("div"); box.append(probe);
    return box;
  }));
  [...host.children].forEach((box, gi) => {
    const g = groups[gi][1], W = Math.min(280, box.clientWidth), gap = W < 200 ? 2 : 3, s = (W - gap * 9) / 10;
    const on = Math.round(g.any_one * 100);
    const svg = el("svg", { width: W, height: W, viewBox: `0 0 ${W} ${W}`, role: "img", "aria-label": `${on} of 100 squares filled: ${pct(g.any_one)} of these papers got at least one rating of 1` });
    for (let i = 0; i < 100; i++) {
      const r = Math.floor(i / 10), c = i % 10;
      el("rect", { x: c * (s + gap), y: r * (s + gap), width: s, height: s, rx: 2, class: "cell" + (i < on ? " on" : "") }, svg);
    }
    const hit = el("rect", { x: 0, y: 0, width: W, height: W, fill: "transparent", tabindex: 0 }, svg);
    const tip = e => showTip(e, groups[gi][0], [
      [pct(g.any_one, 1), "got at least one 1", css("--red")],
      [pct(g.ones, 1), "of all their reviews were 1s"],
      [fmt(g.papers), `papers, ${fmt(g.reviews)} reviews`]]);
    hit.addEventListener("pointermove", tip);
    hit.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); tip({ clientX: r.left + r.width / 2, clientY: r.top + 20 }); });
    hit.addEventListener("pointerleave", hideTip); hit.addEventListener("blur", hideTip);
    box.lastChild.replaceWith(svg);
  });
}
{
  const c = $("cap2");
  c.append(h("b", {}, "Figure 2: "), "Share of papers that got at least one rating of 1, the lowest score. ",
    h("span", { class: "m" }, "Each square is 1% of the group's papers."));
}

// ---------- figure 3: every area
const AR = D.areas;
function fig3() {
  const host = $("c3"), lo = -0.35, hi = 0.05;
  host.replaceChildren(h("div"), h("div", { class: "st" }));
  const W = Math.max(160, host.children[1].clientWidth); host.replaceChildren();
  const rowH = 22, X = v => 8 + (W - 16) * (v - lo) / (hi - lo);
  AR.forEach(a => {
    const nm = h("div", { class: "nm" }, cap(a.area), " ", h("small", {}, fmt(a.n)));
    const svg = el("svg", { width: W, height: rowH, viewBox: `0 0 ${W} ${rowH}`, role: "img", "aria-label": `${a.area}: correlation ${sg(a.spearman)}` });
    for (const t of [-0.3, -0.2, -0.1]) el("line", { x1: X(t), x2: X(t), y1: 0, y2: rowH, class: "gridline" }, svg);
    el("line", { x1: X(0), x2: X(0), y1: 0, y2: rowH, class: "zero" }, svg);
    el("line", { x1: X(a.ci[0]), x2: X(a.ci[1]), y1: rowH / 2, y2: rowH / 2, class: "whisk" }, svg);
    el("circle", { cx: X(a.spearman), cy: rowH / 2, r: 5, class: "dot-red" }, svg);
    const hit = el("rect", { x: 0, y: 0, width: W, height: rowH, fill: "transparent", tabindex: 0 }, svg);
    const on = e => showTip(e, cap(a.area), [
      [sg(a.spearman), `rank correlation (95% CI ${sg(a.ci[0])} to ${sg(a.ci[1])})`, css("--red")],
      [fmt(a.n), "papers"], [f2(a.mean_rating), "average rating"]]);
    hit.addEventListener("pointermove", on);
    hit.addEventListener("focus", () => { const r = hit.getBoundingClientRect(); on({ clientX: r.left + X(a.spearman), clientY: r.top }); });
    hit.addEventListener("pointerleave", hideTip); hit.addEventListener("blur", hideTip);
    host.append(nm, h("div", { class: "st" }, svg));
  });
  const ax = el("svg", { width: W, height: 40, viewBox: `0 0 ${W} 40` });
  for (const t of [-0.3, -0.2, -0.1, 0]) el("text", { x: X(t), y: 14, "text-anchor": "middle" }, ax).textContent = t === 0 ? "0" : sg(t, 1);
  el("text", { x: X(0) - 4, y: 34, "text-anchor": "end" }, ax).textContent = "further left = bigger drop in ratings";
  host.append(h("div", { class: "ax" }, ax));
}
{
  const c = $("cap3");
  c.append(h("b", {}, "Figure 3: "), `It shows up in all ${AR.length} research areas. `,
    h("span", { class: "m" }, `Rank correlation between AI score and average rating inside each primary area with 200+ papers; lines are 95% CIs. The number after each area is its paper count. Comparing papers only within their own area leaves the correlation unchanged (${sg(D.within_area.pearson)} vs ${sg(M.pearson)} overall), so topic mix doesn't explain it.`));
}

// ---------- limitations (kept short and honest: this is what replies will ask about)
const LIM = [
  ["It's a correlation, not a cause. ", "Rushed or weaker papers may lean harder on LLM writing, reviewers may mark down prose that sounds generated, or both. This data can't tell those apart."],
  ["Across all papers the link is weak. ", `The overall rank correlation is ${sg(M.spearman)}, and the AI score explains about ${pct(M.r2, 0)} of the variation in ratings. Everything happens in the top ~40%; below that it's flat.`],
  ["A detector score is not proof. ", `Most submissions score high (the median is ${f2(D.ms_summary.median)}), and no score says a specific paper was machine-written. Don't use this to accuse anyone.`],
  ["Reviews can still change. ", `Ratings are a snapshot from ${when(D.snapshot)}, during the discussion period. Most papers have three reviews.`],
];
$("lim").replaceChildren(...LIM.map(([b, t]) => h("li", {}, h("b", {}, b), t)));

// ---------- appendix
{
  const A = $("appx"), tbl = (head, rows) => {
    const t = h("table", { class: "plain" }), tr = h("tr"); head.forEach(s => tr.append(h("th", {}, s)));
    t.append(h("thead", {}, tr)); const b = h("tbody");
    rows.forEach(r => { const row = h("tr"); r.forEach(c => row.append(h("td", {}, c))); b.append(row); }); t.append(b);
    return h("div", { class: "tbl" }, t);
  };
  A.append(
    h("h3", {}, "Data"),
    h("p", { class: "small" }, "AI scores come from ", h("a", { href: "https://opentextdetector.com/?collection=iclr%2F2027&sort=score" }, "Open Text Detector"),
      ` (all ${fmt(D.n_detector_fetched)} ICLR 2027 papers it lists, model ${D.flag_model}). The "AI score" is its average score: the mean per-sentence probability that a sentence in the paper's main body is AI-written, with references and appendix excluded. Review ratings come from `,
      h("a", { href: "https://shiqiangw.github.io/iclr-2027-scores/" }, "ICLR 2027 Scores"),
      `, which mirrors OpenReview and excludes withdrawn and desk-rejected papers. Papers were matched on OpenReview ID: ${fmt(D.n_joined)} papers and ${fmt(D.reviews)} reviews. Papers need at least ${D.min_sentences} scored sentences, the detector site's own minimum.`),
    h("p", { class: "small" }, `"Top-10% cutoff" is an average rating of ${f2(D.top10_cutoff)} or more, the cutoff published on the scores site. Confidence intervals are bootstrap percentiles (2,000 resamples for the headline correlation).`),
    h("h3", {}, "Robustness"),
    h("p", { class: "small" }, "Every detector setting and rating summary points the same way. Negative means a higher AI score goes with a lower rating."),
    tbl(["Comparison", "Papers", "Rank corr. (ρ)", "95% CI", "Pearson r"],
      D.robustness.map(r => [h("span", {}, r.label, h("br"), h("span", { class: "note" }, r.note)), fmt(r.n), sg(r.spearman, 3), `${sg(r.spearman_ci[0], 3)} to ${sg(r.spearman_ci[1], 3)}`, sg(r.pearson, 3)])),
    h("h3", {}, "By share of sentences flagged"),
    h("p", { class: "small" }, `The detector site's headline number is the share of a paper's sentences flagged as AI at a 0.1% false-positive rate. ${pct(D.fs_summary.exactly100)} of papers have every sentence flagged; those are the ones that drop.`),
    tbl(["Sentences flagged", "Papers", "Avg rating", "95% CI", "Top-10% cutoff"],
      D.flag_bands.map(b => [b.label, fmt(b.n), f3(b.mean), `${f3(b.ci[0])}–${f3(b.ci[1])}`, pct(b.top10, 1)])),
    h("h3", {}, "Figure 1 as a table"),
    tbl(["Rank by AI score", "AI score", "Papers", "Avg rating", "95% CI", "Top-10% cutoff"],
      V.map(v => [`${(v.k - 1) * 5}–${v.k * 5}%`, `${f3(v.lo)}–${f3(v.hi)}`, fmt(v.n), f3(v.mean), `${f3(v.ci[0])}–${f3(v.ci[1])}`, pct(v.top10, 1)])),
    h("h3", {}, "Individual reviews by AI-score decile"),
    tbl(["Decile", "Reviews", "1s", "2s", "3s", "4s"],
      D.deciles.map(d => [`${d.k}`, fmt(d.n_reviews), pct(d.dist["1"], 1), pct(d.dist["2"], 1), pct(d.dist["3"], 1), pct(d.dist["4"], 1)])),
    h("p", { class: "small", style: "margin-top:18px" }, "Crawl and analysis code: ", h("a", { href: REPO }, REPO.replace(/^https:\/\//, "")), ". This page shows group totals only; per-paper scores are on the two source sites.")
  );
}
$("foot").textContent = `Built ${new Date(D.built_at).toLocaleDateString("en-US", { dateStyle: "medium" })} from public data. Not affiliated with ICLR, OpenReview, or either source site.`;

// ---------- render (dark mode follows the device setting)
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => renderAll(false));
function renderAll(animate) { fig1(animate); fig2(); fig3(); }
const start = () => renderAll(true);
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(start);
let rt, lastW = innerWidth;
addEventListener("resize", () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rt); rt = setTimeout(() => renderAll(false), 120); });
</script>
</body>
</html>
